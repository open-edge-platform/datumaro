name: TruffleHog Secret Scan

permissions: {} # No permissions by default on workflow level

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          disable-telemetry: true
          egress-policy: block
          allowed-endpoints: >
            api.box.com:443
            api.github.com:443
            api.sonarcloud.io:443
            api.t.ly:443
            api.unify.id:443
            app.eraser.io:443
            auth.docker.io:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            registry.npmjs.org:443
            sonarcloud.io:443
            upload.pypi.org:443
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          # Lob detector excluded as Python test function names match Lob `\b(live|test)_[a-zA-Z0-9_]{35}\b` 
          # pattern causing false-positive "verified" findings. This repo does not use the Lob postal API.
          extra_args: --results=verified,unknown --exclude-paths=.trufflehogignore --exclude-detectors=Lob
