name: PR Test
on:
  pull_request:
    branches:
      - develop
      - release**
  merge_group:
    branches:
      - develop
      - release**
  push:
    branches:
      - develop
      - release**

permissions:
  # The id-token permission is required by Codecov to use OIDC
  id-token: write

# This is what will cancel the workflow concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
jobs:
  pr_test:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "windows-2022", "macos-15"]
        python-version: ["3.11", "3.14"]
    name: pr test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          disable-telemetry: true
          egress-policy: block
          allowed-endpoints: >
            cli.codecov.io:443
            files.pythonhosted.org:443
            github.com:443
            index.crates.io:443
            ingest.codecov.io:443
            keybase.io:443
            o26192.ingest.us.sentry.io:443
            objects.githubusercontent.com:443
            ossci-datasets.s3.amazonaws.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            static.crates.io:443
            static.rust-lang.org:443
            storage.googleapis.com:443
            yann.lecun.com:80
      
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installing Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: ${{ matrix.python-version }}
          version: "0.8.15"

      - name: Installing dependencies
        run: uv sync --locked --all-extras --dev

      # TEMP: remove once the LLVM duplicate-option abort is diagnosed
      - name: "TEMP: diagnose LLVM duplicate-option abort"
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.11'
        continue-on-error: true
        run: |
          set +e
          probe() { echo "::group::$1"; uv run python -X faulthandler -c "$1"; echo "exit=$?"; echo "::endgroup::"; }

          probe "import triton, tensorflow"

          # Does a newer TF avoid the clash? Isolated venvs, not the project env.
          for TFV in 2.21.0 2.22.0rc0; do
            echo "::group::import tensorflow, triton with tensorflow==$TFV"
            uv venv -q -p 3.11 "/tmp/tf-$TFV"
            uv pip install -q --python "/tmp/tf-$TFV" "tensorflow==$TFV" triton==3.9.0
            "/tmp/tf-$TFV/bin/python" -X faulthandler -c "import tensorflow, triton" 2>&1 | grep -v '^  File' | tail -n 5
            echo "exit=${PIPESTATUS[0]}"
            echo "::endgroup::"
          done

          echo "::group::TF shared libraries exporting llvm::cl symbols"
          TFDIR=$(uv run python -c "import importlib.util,os;print(os.path.dirname(importlib.util.find_spec('tensorflow').origin))")
          find "$TFDIR" -name '*.so*' -type f | while read -r f; do
            n=$(nm -D --defined-only "$f" 2>/dev/null | grep -c '_ZN4llvm2cl')
            [ "$n" -gt 0 ] && echo "$n $f"
          done
          echo "::endgroup::"

          # Run the venv python directly so LD_DEBUG doesn't also trace uv.
          echo "::group::LD_DEBUG: where libtriton's llvm::cl symbols bind (import tensorflow, triton)"
          LD_DEBUG=bindings LD_DEBUG_OUTPUT=/tmp/ld .venv/bin/python -c "import tensorflow, triton"
          echo "exit=$?"
          echo "-- target library counts --"
          grep -h 'binding file [^ ]*libtriton\.so' /tmp/ld.* | grep '_ZN4llvm2cl' \
            | sed -E 's/.* to ([^ ]+) .*/\1/' | sort | uniq -c
          echo "-- sample bindings to non-triton libraries --"
          grep -h 'binding file [^ ]*libtriton\.so' /tmp/ld.* | grep '_ZN4llvm2cl' \
            | grep -v ' to [^ ]*libtriton\.so' | head -n 20
          echo "::endgroup::"

      - name: Tests
        run: uv run pytest --cov --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: ${{ matrix.os }}_Python-${{ matrix.python-version }}
          use_oidc: true
